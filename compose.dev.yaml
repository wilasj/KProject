services:
  kproject.api:
    image: kproject.api-local
    build:
      context: .
      dockerfile: KProject.Api/Dockerfile
      target: dev
      args:
        BUILD_CONFIGURATION: Debug
    environment:
      DOTNET_ENVIRONMENT: Development
    ports:
      - "8080:8080"
    depends_on:
      kproject.database:
        condition: service_healthy

  kproject.database:
    image: postgres:17
    environment:
      POSTGRES_DB: kproject
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  db-data: