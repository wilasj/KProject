<aside class="sidebar">
  <div class="sidebar__avatar">{{ initial }}</div>

  <nav class="sidebar__nav">
    @for (item of navItems; track item.path) {
      <a
        [routerLink]="item.path"
        routerLinkActive="active"
        class="sidebar__nav-item"
        [attr.aria-label]="item.label"
        [attr.title]="item.label"
      >
        <span class="material-symbols-outlined">{{ item.icon }}</span>
      </a>
    }
  </nav>

  <div class="sidebar__bottom">
    <button
      class="sidebar__import"
      (click)="importOpen.set(true)"
      aria-label="Importar PDF"
      title="Importar PDF"
    >
      <span class="material-symbols-outlined">upload_file</span>
    </button>

    <button
      class="sidebar__invite"
      (click)="inviteOpen.set(true)"
      aria-label="Convidar usuário"
      title="Convidar"
    >
      <span class="material-symbols-outlined">person_add</span>
    </button>

    <button class="sidebar__logout" (click)="logoutClick.emit()" aria-label="Sair" title="Sair">
      <span class="material-symbols-outlined">logout</span>
    </button>
  </div>
</aside>

@if (inviteOpen()) {
  <app-invite-popup (close)="inviteOpen.set(false)" />
}

@if (importOpen()) {
  <app-pdf-importer (close)="importOpen.set(false)" />
}
