@if (clients().length === 0) {
  <div class="client-table__empty">
    <span class="material-symbols-outlined">group</span>
    <p>Nenhum cliente encontrado</p>
  </div>
} @else {
  <div class="client-table__list">
    @for (client of clients(); track client.id) {
      <div class="client-table__row">
        <span class="client-table__row-id">#{{ client.id }}</span>
        <span class="client-table__row-name">{{ client.nome }}</span>
      </div>
    }
  </div>

  <app-pagination
    [total]="total()"
    [current]="currentPage()"
    [pageSize]="pageSize()"
    (pageChange)="pageChange.emit($event)"
  />
}
