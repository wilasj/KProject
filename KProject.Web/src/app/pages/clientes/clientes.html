<app-page-layout [config]="config">
  <ng-template pageLayoutContent let-items let-total="total" let-currentPage="currentPage" let-pageSize="pageSize">
    <app-data-table
      [items]="items"
      [total]="total"
      [currentPage]="currentPage"
      [pageSize]="pageSize"
      emptyIcon="group"
      emptyMessage="Nenhum cliente encontrado"
      (pageChange)="layout().onPageChange($event)"
    >
      <ng-template dataTableRow let-client>
        <div class="client-row">
          <span class="client-row__id">#{{ client.id }}</span>
          <span class="client-row__name">{{ client.nome }}</span>
        </div>
      </ng-template>
    </app-data-table>
  </ng-template>

  <ng-template pageLayoutDrawer>
    <app-client-drawer
      [open]="layout().drawerOpen()"
      (close)="layout().closeDrawer()"
      (clientCreated)="layout().onItemSaved()"
    />
  </ng-template>
</app-page-layout>
