<div class="clientes__main">
  <app-search-bar
    placeholder="Buscar clientes..."
    [initialValue]="initialSearch()"
    (search)="onSearch($event)"
  />

  <div class="clientes__content">
    <div class="clientes__toolbar">
      <h2 class="clientes__title">Clientes</h2>
      <button class="clientes__btn-new" (click)="drawerOpen.set(true)">
        <span class="material-symbols-outlined">add</span>
        Novo Cliente
      </button>
    </div>

    @if (loading()) {
      <div class="clientes__loading">
        <span class="material-symbols-outlined">hourglass_empty</span>
      </div>
    } @else {
      <app-client-table
        [clients]="clients()"
        [total]="total()"
        [currentPage]="currentPage()"
        [pageSize]="pageSize"
        (pageChange)="onPageChange($event)"
      />
    }
  </div>
</div>

<aside class="clientes__drawer" [class.clientes__drawer--open]="drawerOpen()">
  <div class="clientes__drawer-inner">
    <app-client-drawer
      [open]="drawerOpen()"
      (close)="drawerOpen.set(false)"
      (clientCreated)="onClientCreated()"
    />
  </div>
</aside>
