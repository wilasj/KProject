@if (products().length === 0) {
  <div class="product-table__empty">
    <span class="material-symbols-outlined">inventory_2</span>
    <p>Nenhum produto encontrado</p>
  </div>
} @else {
  <div class="product-table__list">
    @for (product of products(); track product.id) {
      <div
        class="product-table__row"
        [class.product-table__row--expanded]="expandedProductId() === product.id"
        (click)="onToggle(product.id)"
      >
        <div class="product-table__row-info">
          <span class="product-table__row-name">{{ product.nome }}</span>
          <span class="product-table__row-meta">
            {{ product.referencia }}
            <span class="product-table__row-dot">•</span>
            {{ product.codigoAnvisa }}
          </span>
          <span class="product-table__row-date">Criado em {{ product.criadoEm | date:'dd/MM/yyyy' }}</span>
        </div>
        <span
          class="material-symbols-outlined product-table__row-chevron"
          [class.product-table__row-chevron--open]="expandedProductId() === product.id"
        >keyboard_arrow_down</span>
      </div>
      <app-product-accordion
        [product]="product"
        [expanded]="expandedProductId() === product.id"
      />
    }
  </div>

  <app-pagination
    [total]="total()"
    [current]="currentPage()"
    [pageSize]="pageSize()"
    (pageChange)="pageChange.emit($event)"
  />
}
