<app-page-layout [config]="config">
  <ng-template pageLayoutContent let-items let-total="total" let-currentPage="currentPage" let-pageSize="pageSize">
    <app-data-table
      [items]="items"
      [total]="total"
      [currentPage]="currentPage"
      [pageSize]="pageSize"
      emptyIcon="inventory_2"
      emptyMessage="Nenhum produto encontrado"
      (pageChange)="layout().onPageChange($event)"
    >
      <ng-template dataTableRow let-product>
        <div class="product-row" [class.product-row--expanded]="accordion.expanded()" (click)="accordion.toggle()">
          <div class="product-row__info">
            <span class="product-row__name">{{ product.nome }}</span>
            <span class="product-row__meta">
              {{ product.referencia }}
              <span class="product-row__dot">·</span>
              {{ product.codigoAnvisa }}
            </span>
            <span class="product-row__date">Criado em {{ product.criadoEm | date:'dd/MM/yyyy' }}</span>
          </div>
          <span
            class="material-symbols-outlined product-row__chevron"
            [class.product-row__chevron--open]="accordion.expanded()"
          >keyboard_arrow_down</span>
        </div>
        <app-product-accordion #accordion [product]="product" />
      </ng-template>
    </app-data-table>
  </ng-template>

  <ng-template pageLayoutDrawer>
    <app-product-drawer
      [open]="layout().drawerOpen()"
      (close)="layout().closeDrawer()"
      (productCreated)="layout().onItemSaved()"
    />
  </ng-template>
</app-page-layout>
