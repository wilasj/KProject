<app-page-layout [config]="config">
  <ng-template pageLayoutContent let-items let-total="total" let-currentPage="currentPage" let-pageSize="pageSize">
    <app-data-table
      [items]="items"
      [total]="total"
      [currentPage]="currentPage"
      [pageSize]="pageSize"
      emptyIcon="receipt_long"
      emptyMessage="Nenhuma venda encontrada"
      (pageChange)="layout().onPageChange($event)"
    >
      <ng-template dataTableRow let-sale>
        <div class="sale-row">
          <div class="sale-row__info">
            <div class="sale-row__title">
              <span class="sale-row__name">Venda #{{ sale.id }}</span>
              <span class="sale-row__badge sale-row__badge--{{ sale.status.toLowerCase() }}">
                {{ sale.status }}
              </span>
            </div>
            <span class="sale-row__meta">
              {{ sale.clienteNome }}
              <span class="sale-row__dot">·</span>
              {{ sale.criadaEm | date:'dd/MM/yyyy' }}
            </span>
          </div>
          <div class="sale-row__right">
            <span class="sale-row__count">{{ sale.totalItens }} produtos</span>
          </div>
        </div>
      </ng-template>
    </app-data-table>
  </ng-template>

  <ng-template pageLayoutDrawer>
    <app-sale-drawer
      [open]="layout().drawerOpen()"
      (close)="layout().closeDrawer()"
      (saleCreated)="layout().onItemSaved()"
      (saleUpdated)="layout().onItemSaved()"
    />
  </ng-template>
</app-page-layout>
