<app-page-layout [config]="config">
  <ng-template pageLayoutContent let-items let-total="total" let-currentPage="currentPage" let-pageSize="pageSize">
    <app-data-table
      [items]="items"
      [total]="total"
      [currentPage]="currentPage"
      [pageSize]="pageSize"
      emptyIcon="receipt_long"
      emptyMessage="Nenhuma venda encontrada"
      (pageChange)="layout().onPageChange($event)"
    >
      <ng-template dataTableRow let-sale>
        <app-sale-accordion
          [sale]="sale"
          (saleUpdated)="layout().onItemSaved()"
        />
      </ng-template>
    </app-data-table>
  </ng-template>

  <ng-template pageLayoutDrawer>
    <app-sale-drawer
      [open]="layout().drawerOpen()"
      (close)="layout().closeDrawer()"
      (saleCreated)="layout().onItemSaved()"
    />
  </ng-template>
</app-page-layout>
