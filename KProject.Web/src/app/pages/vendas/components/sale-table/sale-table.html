@if (sales().length === 0) {
    <div class="sale-table__empty">
        <span class="material-symbols-outlined">receipt_long</span>
        <p>Nenhuma venda encontrada</p>
    </div>
} @else {
    <div class="sale-table__list">
        @for (sale of sales(); track sale.id) {
            <div class="sale-table__row" (click)="saleSelect.emit(sale.id)">
                <div class="sale-table__row-info">
                    <div class="sale-table__row-title">
                        <span class="sale-table__row-name">Venda #{{ sale.id }}</span>
                        <span class="sale-table__badge sale-table__badge--{{ sale.status.toLowerCase() }}">
              {{ sale.status }}
            </span>
                    </div>
                    <span class="sale-table__row-meta">
            {{ sale.clienteNome }}
                        <span class="sale-table__row-dot">•</span>
                        {{ sale.criadaEm | date:'dd/MM/yyyy' }}
          </span>
                </div>
                <div class="sale-table__row-right">
                    <span class="sale-table__row-count">{{ sale.totalItens }} produtos</span>
                    <span class="material-symbols-outlined sale-table__row-chevron">chevron_right</span>
                </div>
            </div>
        }
    </div>

    <app-pagination
        [total]="total()"
        [current]="currentPage()"
        [pageSize]="pageSize()"
        (pageChange)="pageChange.emit($event)"
    />
}
