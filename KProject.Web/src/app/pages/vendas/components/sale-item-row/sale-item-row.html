<div class="sale-item-row" [class.sale-item-row--expanded]="expanded()">
  <button class="sale-item-row__header" (click)="toggle()">
    <span class="material-symbols-outlined sale-item-row__chevron">
      {{ expanded() ? 'expand_less' : 'expand_more' }}
    </span>

    <div class="sale-item-row__info">
      <span class="sale-item-row__field">
        <span class="sale-item-row__label">Produto:</span>
        <span class="sale-item-row__value">{{ item().produtoNome }}</span>
      </span>
      <span class="sale-item-row__sep">·</span>
      <span class="sale-item-row__field">
        <span class="sale-item-row__label">Lote:</span>
        <span class="sale-item-row__value">{{ item().loteNumero }}</span>
      </span>
      <span class="sale-item-row__sep">·</span>
      <span class="sale-item-row__field">
        <span class="sale-item-row__label">Paciente:</span>
        <span class="sale-item-row__value">{{ item().pacienteNome }}</span>
      </span>
    </div>

    <span class="sale-item-row__ratio">{{ used() }}/{{ item().quantidadeConsignada }}</span>
  </button>

  @if (expanded()) {
    <div class="sale-item-row__body">
      <div class="sale-item-row__controls">
        <div class="sale-item-row__control-group">
          <span class="sale-item-row__control-label">Devolvidos</span>
          <div class="sale-item-row__counter">
            <button
              class="sale-item-row__counter-btn sale-item-row__counter-btn--minus"
              (click)="changeDevolvido(-1)"
              [disabled]="readOnly() || item().devolvido === 0"
              aria-label="Diminuir devolvidos"
            >
              <span class="material-symbols-outlined">remove</span>
            </button>
            <span class="sale-item-row__counter-value">{{ item().devolvido }}</span>
            <button
              class="sale-item-row__counter-btn sale-item-row__counter-btn--plus"
              (click)="changeDevolvido(1)"
              [disabled]="readOnly() || item().vendido + item().devolvido >= item().quantidadeConsignada"
              aria-label="Aumentar devolvidos"
            >
              <span class="material-symbols-outlined">add</span>
            </button>
          </div>
        </div>

        <div class="sale-item-row__control-group">
          <span class="sale-item-row__control-label">Vendidos</span>
          <div class="sale-item-row__counter">
            <button
              class="sale-item-row__counter-btn sale-item-row__counter-btn--minus"
              (click)="changeVendido(-1)"
              [disabled]="readOnly() || item().vendido === 0"
              aria-label="Diminuir vendidos"
            >
              <span class="material-symbols-outlined">remove</span>
            </button>
            <span class="sale-item-row__counter-value">{{ item().vendido }}</span>
            <button
              class="sale-item-row__counter-btn sale-item-row__counter-btn--plus"
              (click)="changeVendido(1)"
              [disabled]="readOnly() || item().vendido + item().devolvido >= item().quantidadeConsignada"
              aria-label="Aumentar vendidos"
            >
              <span class="material-symbols-outlined">add</span>
            </button>
          </div>
        </div>
      </div>
    </div>
  }
</div>
